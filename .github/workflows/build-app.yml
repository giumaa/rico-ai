name: Build app

# Builds the Electron installers on every OS and, for tags `v*`, publishes them as a GitHub Release.
#   Windows x64 (NSIS) | macOS arm64 + x64 (dmg) | Linux x64 (AppImage + deb)
# Installers are unsigned (no certificates). electron-builder never publishes by itself (--publish never):
# the app contains no update pings (privacy promise); releases are created by the `release` job below.
# NOTE: `macos-13` was retired by GitHub; Intel macs build on `macos-15-intel`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, args: "--win --x64" }
          - { name: macos-arm64, os: macos-latest, args: "--mac --arm64" }
          - { name: macos-x64, os: macos-15-intel, args: "--mac --x64" }
          - { name: linux-x64, os: ubuntu-latest, args: "--linux --x64" }
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no code-signing certificates available
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (electron-vite)
        run: npm run build

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: List output
        run: |
          for d in dist release; do [ -d "$d" ] && ls -la "$d"; done || true

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb
            app/release/*.exe
            app/release/*.dmg
            app/release/*.AppImage
            app/release/*.deb

  release:
    name: GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release-files
          merge-multiple: true

      - name: Checksums
        working-directory: release-files
        run: |
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
