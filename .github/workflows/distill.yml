name: Distill

# Pipeline (run AFTER "Package models"):  collect recent Libya texts -> distill (up to 20 parallel jobs) -> merge.
#
#  collect : ml/collect_recent.py pulls openly licensed (CC BY / CC BY-SA) text revised since --since (default
#            2026-04-01) from Arabic Wikipedia, Arabic Wikinews and English Wikipedia via the MediaWiki API and writes
#            ml/data/recent/articles.jsonl + ATTRIBUTION.md.
#  generate: each job runs llama.cpp `llama-server` (CPU) with the teacher and, for its slice,
#            (a) answers prompts from ml/data/seed/prompts_ar.jsonl with the Rico persona + few-shots, and
#            (b) reads article chunks and writes 3-5 grounded Libyan-dialect Q&A pairs (with date context).
#            Partial results are uploaded as artifacts after every chunk, so a crash / timeout never loses everything.
#  merge   : filters (eval/score_rules.json + built-in heuristics + grounding checks), de-duplicates, adds the gold
#            seeds (style x3, identity x1 capped at ~10 % of the dataset) -> ml/data/rico_sft.jsonl (+ stats) -> artifact +
#            commit.  Guards: merge fails below --min-distilled (default 1000), a commit needs kept_distilled > 0,
#            every generate job fails if its shard is empty.  merge_only_run_id re-merges an earlier run's shards.
#
# Teacher: Gemma-4-12B-it Q4_K_M (Apache-2.0 + Gemma Prohibited Use Policy; outputs may be used to train other
# models - see docs/ml.md "Licenses").  ~7.4 GB model on a 16 GB / 4 vCPU runner, 3 chunks per job.
# Free minutes are unlimited only on PUBLIC repos - on a private repo this burns the monthly quota.

on:
  workflow_dispatch:
    inputs:
      collect:
        description: "Run the recent-articles collection step (false = reuse ml/data/recent/articles.jsonl from the repo)"
        type: boolean
        default: true
      since:
        description: "Only pages whose latest revision is on/after this date (YYYY-MM-DD)"
        default: "2026-04-01"
      min_articles:
        description: "collect step fails if fewer articles than this were collected (API throttling guard)"
        default: "150"
      shards:
        description: "Number of parallel generate jobs (1-20)"
        default: "20"
        required: true
      samples:
        description: "Answers per seed prompt (different seeds)"
        default: "1"
      qa_samples:
        description: "Q&A generations per article chunk (different seeds)"
        default: "2"
      chunk_minutes:
        description: "Minutes per chunk (3 chunks per job; keep 3 x chunk + ~25 min < 345)"
        default: "95"
      max_tokens:
        description: "Max tokens per prompt answer"
        default: "500"
      temperature:
        description: "Sampling temperature"
        default: "0.7"
      parallel:
        description: "Concurrent requests per job (= llama-server slots)"
        default: "2"
      teacher_url:
        description: "Teacher GGUF URL"
        default: "https://huggingface.co/lmstudio-community/gemma-4-12B-it-GGUF/resolve/main/gemma-4-12B-it-Q4_K_M.gguf"
      teacher_sha256:
        description: "Teacher GGUF sha256 (empty = skip verification)"
        default: "95d83ba36642b1f385fb906b5962a71763361be3bac930a709945f72d97473f8"
      teacher_name:
        description: "Label stored in the data"
        default: "gemma-4-12B-it-Q4_K_M"
      commit_result:
        description: "Commit ml/data/rico_sft.jsonl (+ recent articles/attribution) to the branch"
        type: boolean
        default: true
      llama_cpp_tag:
        description: "llama.cpp release (empty = the tag in the repo-root LLAMA_CPP_TAG file, fallback b11312)"
        default: ""
      min_distilled:
        description: "Merge guard: fail (and write/commit nothing) if fewer teacher-generated records survive the filters"
        default: "1000"
      merge_only_run_id:
        description: "Re-merge the shard artifacts of a previous Distill run (run id) WITHOUT generating anything. Empty = normal run"
        default: ""

permissions:
  contents: read

jobs:
  collect:
    if: ${{ inputs.collect && inputs.merge_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Collect recent Libya texts (CC BY / CC BY-SA only)
        env:
          SINCE: ${{ inputs.since }}
          MIN_ARTICLES: ${{ inputs.min_articles }}
        run: |
          python3 ml/collect_recent.py --since "$SINCE"
          n=$(wc -l < ml/data/recent/articles.jsonl); echo "collected $n articles"
          head -n 20 ml/data/recent/ATTRIBUTION.md
          # fail fast (before 20 x 5 h of generation) when the API throttled us and little text was collected
          if [ "$n" -lt "${MIN_ARTICLES:-150}" ]; then echo "::error::only $n articles (< ${MIN_ARTICLES:-150}); re-run later"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: recent-articles
          path: |
            ml/data/recent/articles.jsonl
            ml/data/recent/ATTRIBUTION.md
          if-no-files-found: error

  teacher-cache:
    # Download the teacher ONCE (HF) and cache it; the 20 generate jobs restore it from the Actions cache instead of
    # hitting Hugging Face concurrently. (Repo cache quota is 10 GB; the 7.4 GB teacher fits.)
    if: ${{ inputs.merge_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: c
        uses: actions/cache@v6
        with:
          path: teacher-cache/teacher.gguf
          key: teacher-v1-${{ inputs.teacher_sha256 || inputs.teacher_url }}
      - name: Download teacher (cache miss)
        if: ${{ steps.c.outputs.cache-hit != 'true' }}
        env:
          TEACHER_URL: ${{ inputs.teacher_url }}
          TEACHER_SHA: ${{ inputs.teacher_sha256 }}
        run: |
          mkdir -p teacher-cache
          curl -fL --retry 8 --retry-delay 5 --retry-all-errors -C - -o teacher-cache/teacher.gguf "$TEACHER_URL"
          ls -la teacher-cache
          if [ -n "$TEACHER_SHA" ]; then echo "$TEACHER_SHA  teacher-cache/teacher.gguf" | sha256sum -c -; fi

  prepare:
    if: ${{ inputs.merge_only_run_id == '' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          n=$(( SHARDS ))
          if [ "$n" -lt 1 ]; then n=1; fi
          if [ "$n" -gt 20 ]; then n=20; fi
          echo "matrix=$(jq -nc --argjson n "$n" '{shard: [range(0;$n)]}')" >> "$GITHUB_OUTPUT"

  generate:
    needs: [collect, prepare, teacher-cache]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.collect.result == 'success' || needs.collect.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      SAMPLES: ${{ inputs.samples }}
      QA_SAMPLES: ${{ inputs.qa_samples }}
      MAX_TOKENS: ${{ inputs.max_tokens }}
      TEMPERATURE: ${{ inputs.temperature }}
      PARALLEL: ${{ inputs.parallel }}
      CHUNK_MINUTES: ${{ inputs.chunk_minutes }}
      TEACHER_NAME: ${{ inputs.teacher_name }}
      CTX_PER_SLOT: "3072"
    steps:
      - uses: actions/checkout@v7

      - name: Get fresh recent articles
        if: ${{ inputs.collect }}
        uses: actions/download-artifact@v8
        with:
          name: recent-articles
          path: ml/data/recent

      - name: Resolve shard count
        env:
          N: ${{ inputs.shards }}
        run: |
          n=$(( N )); [ "$n" -lt 1 ] && n=1; [ "$n" -gt 20 ] && n=20
          echo "NUM_SHARDS=$n" >> "$GITHUB_ENV"
          ls -la ml/data/recent 2>/dev/null || true

      - name: Resolve llama.cpp tag (input > LLAMA_CPP_TAG file > b11312)
        env:
          TAG_OVERRIDE: ${{ inputs.llama_cpp_tag }}
        run: echo "LLAMA_CPP_TAG=$(bash .github/scripts/llama_tag.sh "$TAG_OVERRIDE" b11312)" | tee -a "$GITHUB_ENV"

      - name: Fetch llama.cpp (linux x64, CPU)
        run: |
          mkdir -p "$RUNNER_TEMP/llama"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/llama.tgz" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_TAG}/llama-${LLAMA_CPP_TAG}-bin-ubuntu-x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/llama.tgz" -C "$RUNNER_TEMP/llama"
          echo "LLAMA_BIN=$RUNNER_TEMP/llama/llama-${LLAMA_CPP_TAG}" >> "$GITHUB_ENV"

      - name: Restore teacher from cache
        id: tc
        uses: actions/cache/restore@v6
        with:
          path: teacher-cache/teacher.gguf
          key: teacher-v1-${{ inputs.teacher_sha256 || inputs.teacher_url }}

      - name: Teacher model (download only if the cache missed)
        env:
          TEACHER_URL: ${{ inputs.teacher_url }}
          TEACHER_SHA: ${{ inputs.teacher_sha256 }}
          CACHE_HIT: ${{ steps.tc.outputs.cache-hit }}
        run: |
          f="teacher-cache/teacher.gguf"
          if [ "$CACHE_HIT" != "true" ]; then
            mkdir -p teacher-cache
            sleep $(( SHARD * 6 ))      # stagger the 20 jobs so Hugging Face does not throttle us
            for attempt in 1 2 3; do
              curl -fL --retry 8 --retry-delay 10 --retry-all-errors -C - -o "$f" "$TEACHER_URL" && break
              echo "download attempt $attempt failed"; sleep 30
            done
          fi
          ls -la "$f"
          if [ -n "$TEACHER_SHA" ]; then echo "$TEACHER_SHA  $f" | sha256sum -c -; fi
          echo "TEACHER_GGUF=$GITHUB_WORKSPACE/$f" >> "$GITHUB_ENV"
          free -m | sed -n 1,3p; nproc; lscpu | grep -E "Model name|Flags" | cut -c1-160 | head -2

      - name: Generate - chunk 1
        continue-on-error: true
        run: bash .github/scripts/run_chunk.sh
      - name: Checkpoint 1
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distill-shard-${{ matrix.shard }}
          path: work/shard-${{ matrix.shard }}.jsonl
          overwrite: true
          if-no-files-found: warn

      - name: Generate - chunk 2
        continue-on-error: true
        run: bash .github/scripts/run_chunk.sh
      - name: Checkpoint 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distill-shard-${{ matrix.shard }}
          path: work/shard-${{ matrix.shard }}.jsonl
          overwrite: true
          if-no-files-found: warn

      - name: Generate - chunk 3
        continue-on-error: true
        run: bash .github/scripts/run_chunk.sh
      - name: Final checkpoint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distill-shard-${{ matrix.shard }}
          path: work/shard-${{ matrix.shard }}.jsonl
          overwrite: true
          if-no-files-found: warn

      - name: Assert this shard produced output
        # every generate job must deliver data: a silent "0 records" shard was the failure mode of the first test runs
        run: |
          f="work/shard-${SHARD}.jsonl"
          n=$( [ -f "$f" ] && grep -c . "$f" || echo 0 )
          echo "shard ${SHARD}: ${n} records in ${f}"
          if [ "$n" -le 0 ]; then echo "::error::shard ${SHARD} produced an empty output (teacher server never answered?)"; exit 1; fi

      - name: Server + memory logs (tail)
        if: always()
        run: |
          echo "--- llama-server.log"; tail -n 25 "$RUNNER_TEMP/llama-server.log" || true
          echo "--- mem.log"; tail -n 12 "$RUNNER_TEMP/mem.log" || true
          grep -c GUARD "$RUNNER_TEMP/mem.log" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distill-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/llama-server.log
            ${{ runner.temp }}/mem.log
          retention-days: 7
          if-no-files-found: ignore

  merge:
    needs: generate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write    # commit the dataset
      actions: read      # download artifacts of another run (merge_only_run_id)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Get fresh recent articles + attribution
        if: ${{ inputs.collect && inputs.merge_only_run_id == '' }}
        uses: actions/download-artifact@v8
        with:
          name: recent-articles
          path: ml/data/recent
      - name: Get recent articles + attribution of run ${{ inputs.merge_only_run_id }}
        if: ${{ inputs.merge_only_run_id != '' }}
        continue-on-error: true      # that run may have used the repo copy (collect=false)
        uses: actions/download-artifact@v8
        with:
          name: recent-articles
          path: ml/data/recent
          run-id: ${{ inputs.merge_only_run_id }}
          github-token: ${{ github.token }}
      - name: Get shard artifacts (this run)
        if: ${{ inputs.merge_only_run_id == '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: distill-shard-*
          path: shards
      - name: Get shard artifacts of run ${{ inputs.merge_only_run_id }}
        if: ${{ inputs.merge_only_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: distill-shard-*
          path: shards
          run-id: ${{ inputs.merge_only_run_id }}
          github-token: ${{ github.token }}
      - name: Merge, filter, dedup, mix (style x3, identity <= 10 %); fails below --min-distilled
        env:
          MIN_DISTILLED: ${{ inputs.min_distilled }}
        run: |
          find shards -name '*.jsonl' | head -n 50
          python3 ml/distill.py merge --min-distilled "${MIN_DISTILLED:-1000}" --shards-dir shards --out ml/data/rico_sft.jsonl --style-repeat 3 --identity-repeat 1 --identity-frac 0.10
          cat ml/data/rico_sft.stats.json
      - uses: actions/upload-artifact@v7
        with:
          name: rico-sft
          path: |
            ml/data/rico_sft.jsonl
            ml/data/rico_sft.stats.json
            ml/data/rico_sft.NOTICE.md
            ml/data/recent/ATTRIBUTION.md
      - name: Commit dataset (+ recent articles & attribution)
        if: ${{ inputs.commit_result }}
        run: |
          kept=$(python3 -c "import json; print(json.load(open('ml/data/rico_sft.stats.json'))['kept_distilled'])")
          if [ "$kept" -le 0 ]; then echo "::warning::kept_distilled=$kept - gold-only dataset, NOT committing"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/data/rico_sft.jsonl ml/data/rico_sft.stats.json
          [ -f ml/data/rico_sft.NOTICE.md ] && git add ml/data/rico_sft.NOTICE.md
          if [ -d ml/data/recent ]; then git add ml/data/recent; fi
          if git diff --cached --quiet; then echo "dataset unchanged"; exit 0; fi
          git commit -m "data: refresh rico_sft.jsonl (self-distillation + recent Libya Q&A) [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
