name: Package models

# Downloads the upstream Q4_K_M GGUF of each tier (models/catalog.json -> source), stamps it with Rico metadata
# (general.name / general.author + a short stable identity line as default system prompt in the chat template - the
# full persona is injected by the app), splits it into <=1900 MB shards (names carry a content revision), copies the
# (unmodified) vision projector `<tier>-mmproj-<sha8>-F16.gguf`, uploads both to the release and commits the real shard
# names/sizes/sha256 back into models/catalog.json.
# Release assets are IMMUTABLE: shipped apps embed their sha256, so nothing is ever overwritten (no --clobber; an
# existing name with different bytes fails the job).  `models-v1` is FROZEN (the shipped catalog points at it) - new
# packs go to `models-v2` (default) or a newer tag.   NOTE: the repo must be PUBLIC for end users to download assets.

on:
  workflow_dispatch:
    inputs:
      tiers:
        description: "Comma separated tiers to package"
        default: "rico-lite,rico,rico-max"
        required: true
      release_tag:
        description: "Release tag that hosts the model shards (models-v1 is frozen and refused)"
        default: "models-v2"
        required: true
      commit_catalog:
        description: "Commit the updated models/catalog.json to the default branch"
        type: boolean
        default: true
      skip_server_check:
        description: "Skip the llama-server /apply-template smoke test"
        type: boolean
        default: false
      llama_cpp_tag:
        description: "llama.cpp release for llama-gguf-split / llama-server (empty = LLAMA_CPP_TAG file, fallback b11312)"
        default: ""

permissions:
  contents: write

concurrency:
  group: package-models
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || 'models-v2' }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        name: Build tier matrix
        env:
          TIERS: ${{ inputs.tiers }}
        run: |
          matrix=$(jq -nc --arg t "$TIERS" '{tier: ($t | split(",") | map(gsub("\\s";"")) | map(select(test("^[a-z0-9-]+$"))))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"
      - name: Ensure release ${{ env.RELEASE_TAG }} exists
        run: |
          if [ "$RELEASE_TAG" = "models-v1" ]; then
            echo "::error::models-v1 is frozen (shipped apps reference its assets by sha256). Use models-v2 or a newer tag."; exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release exists"
          else
            gh release create "$RELEASE_TAG" --target "${{ github.sha }}" --latest=false \
              --title "Rico models (${RELEASE_TAG})" \
              --notes "GGUF model shards for the Rico desktop app (see docs/ml.md). Assets are produced by the 'Package models' workflow. Do not download manually - the app does it."
          fi

  package:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: bash .github/scripts/free_disk.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: python -m pip install --quiet gguf jinja2

      - name: Resolve llama.cpp tag (input > LLAMA_CPP_TAG file > b11312)
        env:
          TAG_OVERRIDE: ${{ inputs.llama_cpp_tag }}
        run: echo "LLAMA_CPP_TAG=$(bash .github/scripts/llama_tag.sh "$TAG_OVERRIDE" b11312)" | tee -a "$GITHUB_ENV"

      - name: Fetch llama.cpp (linux x64, CPU)
        run: |
          mkdir -p "$RUNNER_TEMP/llama"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/llama.tgz" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_TAG}/llama-${LLAMA_CPP_TAG}-bin-ubuntu-x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/llama.tgz" -C "$RUNNER_TEMP/llama"
          echo "LLAMA_BIN=$RUNNER_TEMP/llama/llama-${LLAMA_CPP_TAG}" >> "$GITHUB_ENV"
          ls "$RUNNER_TEMP/llama/llama-${LLAMA_CPP_TAG}" | grep -E "gguf-split|llama-server|llama-quantize"

      - name: Package ${{ matrix.tier }} (download -> patch -> split -> sha256)
        run: |
          mkdir -p "$HOME/rico-work" "$HOME/rico-out"
          python ml/package_model.py run --tier "${{ matrix.tier }}" \
            --work "$HOME/rico-work" --out-dir "$HOME/rico-out" \
            --llama-bin "$LLAMA_BIN" --repo "${{ github.repository }}" --release-tag "$RELEASE_TAG"
          ls -la "$HOME/rico-out"; df -h / | tail -1

      - name: Smoke test - llama.cpp renders the patched template + loads the vision projector
        if: ${{ !inputs.skip_server_check }}
        timeout-minutes: 25
        run: |
          first=$(ls "$HOME/rico-out/${{ matrix.tier }}"-*-Q4_K_M-00001-of-*.gguf | head -n1)
          python ml/package_model.py server-check --gguf "$first" --llama-bin "$LLAMA_BIN" --timeout 1200             --mmproj "$(ls $HOME/rico-out/${{ matrix.tier }}-mmproj-*-F16.gguf | head -n1)"

      - name: Upload shards + mmproj to release ${{ env.RELEASE_TAG }} (never overwrites an existing name)
        run: |
          shopt -s nullglob
          files=("$HOME/rico-out/${{ matrix.tier }}"-*-Q4_K_M-*.gguf "$HOME/rico-out/${{ matrix.tier }}-mmproj-"*-F16.gguf)
          bash .github/scripts/upload_assets.sh "$RELEASE_TAG" "${files[@]}"

      - name: Upload catalog patch artifact
        uses: actions/upload-artifact@v7
        with:
          name: catalog-patch-${{ matrix.tier }}
          path: ~/rico-out/catalog-patch-${{ matrix.tier }}.json
          if-no-files-found: error

  update-catalog:
    needs: package
    if: ${{ inputs.commit_catalog }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          pattern: catalog-patch-*
          path: patches
          merge-multiple: true
      - name: Merge patches into models/catalog.json
        run: python3 ml/package_model.py merge-catalog --patch-dir patches
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- models/catalog.json; then echo "catalog unchanged"; exit 0; fi
          git add models/catalog.json
          git commit -m "chore(models): update catalog with packaged shards [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-json
          path: models/catalog.json
